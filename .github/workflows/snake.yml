name: Generate Contribution Snake

on:
  schedule:
    # Runs every 24 hours
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Himanshu-5680
          # We are making the dots Blue and the Snake Orange so it's NOT green!
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E97627&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E97627&color_dots=#161b22,#003B57,#052FAD,#1BA0D7,#3776AB

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
